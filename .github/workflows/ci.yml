name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ground
          POSTGRES_PASSWORD: ground
          POSTGRES_DB: ground_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ground" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ground:ground@127.0.0.1:5432/ground_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - run: go vet ./...
      - name: Generated SQL code is up to date
        run: go tool sqlc diff
      # -p 1: database-backed tests share one database.
      - run: go test -p 1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date
        run: pnpm api-types && git diff --exit-code app/lib/api-types.ts
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ground
          POSTGRES_PASSWORD: ground
          POSTGRES_DB: ground
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ground" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://ground:ground@127.0.0.1:5432/ground?sslmode=disable
      ADMIN_TOKEN: ci-admin-token
      E2E_ADMIN_TOKEN: ci-admin-token
      API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Migrate, seed sample events, start the API
        run: |
          go build -o bin/app ./cmd/app
          ./bin/app migrate
          ./bin/app seed --samples
          ./bin/app serve &
      - name: Build and start the web app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm build
          pnpm start &
          npx --yes wait-on http://127.0.0.1:3000
      - name: End-to-end tests
        working-directory: web
        run: pnpm e2e
