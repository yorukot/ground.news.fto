services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ground
      POSTGRES_PASSWORD: ground
      POSTGRES_DB: ground
    ports:
      # 5433 on the host so it doesn't collide with a local Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ground -d ground"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
